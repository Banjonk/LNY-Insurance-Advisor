name: Affiliate Link Health Checker (Insurance Advisor)

on:
  schedule:
    # รันอัตโนมัติทุกวันจันทร์ เวลา 09:00 น. ตามเวลาไทย (UTC 02:00)
    - cron: '0 2 * * 1'
  # รองรับการกดรันด้วยตนเองผ่านหน้าเว็บ GitHub
  workflow_dispatch:

jobs:
  check-insurance-links:
    runs-on: ubuntu-latest

    steps:
      - name: 1. ดึงโค้ดโปรเจกต์ Insurance
        uses: actions/checkout@v4

      - name: 2. เตรียมระบบ Node.js เวอร์ชัน 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. สั่งรันสคริปต์สแกนลิงก์ประกัน
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/check_links.js
